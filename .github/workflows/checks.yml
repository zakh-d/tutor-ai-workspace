name: Application checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4-bookworm
        env:
          POSTGRES_DB: tutor
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tutor"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tutor:test-only@localhost:5432/tutor
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install uv==0.7.13
      - run: uv sync --frozen
      - run: uv run python -m app.migrate
      - run: uv run pytest -q
      - run: SCHEDULING_INTEGRATION=1 uv run pytest -q tests/test_scheduling.py
      - run: python -m unittest discover -s infra/release -p 'test_*.py' -v
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: docker compose --env-file .env.example config --quiet

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    concurrency:
      group: publish-main
      cancel-in-progress: false
    env:
      VITE_KEYCLOAK_URL: ${{ vars.VITE_KEYCLOAK_URL || 'https://auth.zahk.tech' }}
      VITE_KEYCLOAK_REALM: ${{ vars.VITE_KEYCLOAK_REALM || 'tutor' }}
      VITE_KEYCLOAK_CLIENT_ID: ${{ vars.VITE_KEYCLOAK_CLIENT_ID || 'tutor-web' }}
      IMAGE_PLATFORMS: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Set up image builder
        run: docker buildx create --use --bootstrap
      - name: Publish image and Git build tag
        run: python infra/release/publish.py
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
