name: Application checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4-bookworm
        env:
          POSTGRES_DB: tutor
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tutor"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tutor:test-only@localhost:5432/tutor
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install uv==0.7.13
      - run: uv sync --frozen
      - run: uv run python -m app.migrate
      - run: uv run pytest -q
      - run: SCHEDULING_INTEGRATION=1 uv run pytest -q tests/test_scheduling.py
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: docker compose --env-file .env.example config --quiet
