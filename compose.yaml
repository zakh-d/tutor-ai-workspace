name: tutor-workspace
x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://app_runtime:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/tutor
  KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://auth.localhost/realms/tutor}
  KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/tutor/protocol/openid-connect/certs
  API_AUDIENCE: tutor-api
  MCP_AUDIENCE: ${MCP_AUDIENCE:-https://app.localhost/mcp}
  CORS_ORIGINS: ${PUBLIC_BASE_URL:-https://app.localhost}
  GOOGLE_REDIRECT_URI: ${PUBLIC_BASE_URL:-https://app.localhost}/api/v1/calendar/connection/callback
  TUTOR_CLIENT_ID: tutor-web
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://app.localhost}
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-tutor-app}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-tutor-materials}
  CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
services:
  postgres:
    image: postgres:17.4-bookworm
    environment:
      POSTGRES_DB: tutor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?set MIGRATION_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro,Z
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d tutor]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  minio:
    image: minio/minio@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-tutor-app}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  bucket-init:
    image: minio/minio@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    depends_on:
      minio: {condition: service_healthy}
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-tutor-app}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-tutor-materials}
    entrypoint: [/bin/sh, -ec]
    command:
      - 'mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; mc mb --ignore-existing "local/$$S3_BUCKET"; mc anonymous set none "local/$$S3_BUCKET"'
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    command: [start, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/tutor
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_URL:-https://auth.localhost}
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      APP_URL: ${PUBLIC_BASE_URL:-https://app.localhost}
      MCP_RESOURCE: ${MCP_AUDIENCE:-https://app.localhost/mcp}
    volumes:
      - ./infra/keycloak/tutor-realm.json:/opt/keycloak/data/import/tutor-realm.json:ro,Z
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  migrate:
    image: tutor-workspace-app:local
    build:
      context: .
      args:
        VITE_KEYCLOAK_URL: ${KEYCLOAK_URL:-https://auth.localhost}
        VITE_KEYCLOAK_REALM: tutor
        VITE_KEYCLOAK_CLIENT_ID: tutor-web
    environment:
      <<: *app-environment
      DATABASE_URL: postgresql+psycopg://app_migrator:${MIGRATION_DB_PASSWORD:?set MIGRATION_DB_PASSWORD}@postgres:5432/tutor
    command: [python, -m, app.migrate]
    depends_on:
      postgres: {condition: service_healthy}
      bucket-init: {condition: service_completed_successfully}
  app:
    image: tutor-workspace-app:local
    environment: *app-environment
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  worker:
    image: tutor-workspace-app:local
    environment: *app-environment
    command: [python, -m, app.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  proxy:
    image: caddy:2.10.0-alpine
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      APP_HOST: ${APP_HOST:-app.localhost}
      AUTH_HOST: ${AUTH_HOST:-auth.localhost}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: {condition: service_healthy}
      keycloak: {condition: service_started}
    restart: unless-stopped
volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
